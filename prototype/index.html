<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiket Fasilitas HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tiga kolom proses (HP pelapor → notifikasi → panel admin), stepper alur di atas. Token dari design system Aset Kantor Alpro. */
:root{
  --page:#f8fafc; --surface:#ffffff; --paper:#ffffff; --paper-ink:#0f172a;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand-50:#fff7ed; --brand-100:#ffedd5; --brand-200:#fed7aa; --brand-300:#fdba74; --brand-400:#fb923c; --brand-500:#f97316; --brand-600:#ea580c; --brand-text:#c2410c;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-400:#94a3b8; --slate-600:#475569; --slate-700:#334155; --slate-900:#0f172a;
  --red-50:#fef2f2; --red-200:#fecaca; --red-500:#ef4444; --red-600:#dc2626; --red-text:#b91c1c;
  --amber-50:#fffbeb; --amber-200:#fde68a; --amber-text:#b45309;
  --emerald-50:#ecfdf5; --emerald-200:#a7f3d0; --emerald-text:#047857;
  --sky-50:#f0f9ff; --sky-200:#bae6fd; --sky-text:#0369a1;
  --violet-50:#f5f3ff; --violet-200:#ddd6fe; --violet-text:#6d28d9;
  --bezel:#1e293b; --viewfinder:#0f172a; --on-dark:#f8fafc;
  --shadow-card:0 1px 3px 0 #e2e8f080, 0 1px 2px -1px #e2e8f080;
  --shadow-primary:0 1px 2px 0 #f9731633;
  --shadow-pop:0 10px 30px -10px #0f172a40;
  --font:"Plus Jakarta Sans","Inter",ui-sans-serif,system-ui,sans-serif;
  --r-lg:8px; --r-xl:12px; --r-2xl:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b1220; --surface:#111a2b; --ink:#e6ebf2; --muted:#9aa6b8; --line:#2a3546;
    --brand-50:#2a1a0e; --brand-100:#3b2412; --brand-200:#5c3616; --brand-300:#8a4b1a; --brand-text:#fdba74;
    --slate-50:#162135; --slate-100:#1c2940; --slate-200:#2a3851; --slate-400:#8391a7; --slate-600:#aeb9c9; --slate-700:#c6cfdb;
    --red-50:#33161a; --red-200:#6b252c; --red-text:#fca5a5;
    --amber-50:#2e2410; --amber-200:#5e4818; --amber-text:#fcd34d;
    --emerald-50:#0f2a22; --emerald-200:#1a5240; --emerald-text:#6ee7b7;
    --sky-50:#0f2333; --sky-200:#1d4561; --sky-text:#7dd3fc;
    --violet-50:#231a3a; --violet-200:#43357a; --violet-text:#c4b5fd;
    --bezel:#2a3546; --viewfinder:#020617;
    --shadow-card:0 1px 3px 0 #00000059, 0 1px 2px -1px #00000059;
    --shadow-pop:0 10px 30px -10px #000000a0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0b1220; --surface:#111a2b; --ink:#e6ebf2; --muted:#9aa6b8; --line:#2a3546;
  --brand-50:#2a1a0e; --brand-100:#3b2412; --brand-200:#5c3616; --brand-300:#8a4b1a; --brand-text:#fdba74;
  --slate-50:#162135; --slate-100:#1c2940; --slate-200:#2a3851; --slate-400:#8391a7; --slate-600:#aeb9c9; --slate-700:#c6cfdb;
  --red-50:#33161a; --red-200:#6b252c; --red-text:#fca5a5;
  --amber-50:#2e2410; --amber-200:#5e4818; --amber-text:#fcd34d;
  --emerald-50:#0f2a22; --emerald-200:#1a5240; --emerald-text:#6ee7b7;
  --sky-50:#0f2333; --sky-200:#1d4561; --sky-text:#7dd3fc;
  --violet-50:#231a3a; --violet-200:#43357a; --violet-text:#c4b5fd;
  --bezel:#2a3546; --viewfinder:#020617;
  --shadow-card:0 1px 3px 0 #00000059, 0 1px 2px -1px #00000059;
  --shadow-pop:0 10px 30px -10px #000000a0;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,dl{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.caption{font-size:12px;line-height:16px;color:var(--muted)}
.ic{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:9999px;background:#ffffff;flex:none;display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;display:block}
.logo.sm{width:28px;height:28px}
.brandname{display:flex;flex-direction:column;min-width:0}
.brandname b{font-size:18px;line-height:24px;font-weight:800;letter-spacing:-.01em}
.topbar .spacer{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-xl);padding:10px 16px;font-weight:600;font-size:14px;line-height:20px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn[disabled]{cursor:not-allowed;opacity:.6;transform:none}
.btn-primary{background:var(--brand-500);color:#ffffff;box-shadow:var(--shadow-primary)}
.btn-primary:hover:not([disabled]){background:var(--brand-600)}
.btn-primary[disabled]{background:var(--brand-300);opacity:1}
.btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-secondary:hover:not([disabled]){background:var(--slate-50)}
.btn-soft{background:var(--brand-50);border:1px solid var(--brand-200);color:var(--brand-text)}
.btn-soft:hover:not([disabled]){background:var(--brand-100)}
.btn-ghost{color:var(--slate-600)}
.btn-ghost:hover:not([disabled]){background:var(--slate-100)}
.btn-danger{background:var(--red-600);color:#ffffff}
.btn-sm{padding:6px 12px;font-size:12px;line-height:16px;border-radius:10px}
.btn-block{width:100%}
.linkbtn{color:var(--brand-text);font-weight:600;font-size:12px}
.linkbtn:hover{text-decoration:underline}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow-card)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px;line-height:24px;font-weight:700}
.card-b{padding:20px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:600;border:1px solid var(--slate-200);background:var(--slate-100);color:var(--slate-600);white-space:nowrap}
.chip.sky{background:var(--sky-50);border-color:var(--sky-200);color:var(--sky-text)}
.chip.violet{background:var(--violet-50);border-color:var(--violet-200);color:var(--violet-text)}
.chip.brand{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-text)}
.chip.amber{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-text)}
.chip.emerald{background:var(--emerald-50);border-color:var(--emerald-200);color:var(--emerald-text)}
.chip.red{background:var(--red-50);border-color:var(--red-200);color:var(--red-text)}

/* Callout */
.callout{display:flex;gap:10px;border-radius:var(--r-xl);padding:12px 14px;border:1px solid var(--sky-200);background:var(--sky-50);color:var(--ink)}
.callout .ic{margin-top:2px;color:var(--sky-text)}
.callout.amber{border-color:var(--amber-200);background:var(--amber-50)} .callout.amber .ic{color:var(--amber-text)}
.callout.red{border-color:var(--red-200);background:var(--red-50)} .callout.red .ic{color:var(--red-text)}
.callout.emerald{border-color:var(--emerald-200);background:var(--emerald-50)} .callout.emerald .ic{color:var(--emerald-text)}
.callout.brand{border-color:var(--brand-200);background:var(--brand-50)} .callout.brand .ic{color:var(--brand-text)}
.callout b{font-weight:700}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-weight:600;color:var(--slate-700)}
.req{color:var(--red-500)}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-xl);padding:10px 12px;font-size:14px;line-height:20px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{resize:vertical;min-height:76px}
.input::placeholder,.textarea::placeholder{color:var(--slate-400)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-400);box-shadow:0 0 0 4px var(--brand-100)}
.invalid{border-color:var(--red-500)!important}
.err{color:var(--red-text);font-size:12px;line-height:16px}
.hint{font-size:12px;line-height:16px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--slate-100);border-radius:var(--r-xl);flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-lg);font-weight:600;color:var(--slate-600)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--brand-text);box-shadow:var(--shadow-card)}
.count{font-size:11px;line-height:16px;font-weight:600;padding:0 6px;border-radius:9999px;background:var(--slate-200);color:var(--slate-600)}
.tab[aria-selected="true"] .count{background:var(--brand-100);color:var(--brand-text)}

/* Stepper */
.flow{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.step .dot{width:40px;height:40px;border-radius:9999px;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--slate-400);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:19px;left:calc(-50% + 20px);right:calc(50% + 20px);height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.current::before{background:var(--brand-400)}
.step.done .dot{background:var(--brand-500);border-color:var(--brand-500);color:#ffffff}
.step.current .dot{border-color:var(--brand-500);color:var(--brand-text);background:var(--brand-50);box-shadow:0 0 0 4px var(--brand-100)}
.step b{font-size:12px;line-height:16px;font-weight:700}
.step span{font-size:11px;line-height:14px;color:var(--muted)}
.step.todo b{color:var(--muted)}
.guide{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);padding-left:20px}
.guide p{color:var(--slate-700)}
.eyebrow{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text)}

/* Columns */
.switch{display:none}
.cols{display:grid;gap:20px;grid-template-columns:380px minmax(0,340px) minmax(0,1fr);align-items:start}
.col-notif .tab{padding:6px 9px}
.col{min-width:0}
.colhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-inline:4px}
.colhead .n{width:22px;height:22px;border-radius:9999px;background:var(--brand-500);color:#ffffff;font-size:12px;font-weight:700;display:grid;place-items:center}
.colhead b{font-weight:700}
@media (max-width:1279px){
  .cols{grid-template-columns:380px minmax(0,1fr)}
  .cols[data-right="admin"] .col-notif{display:none}
  .cols[data-right="notif"] .col-admin{display:none}
  .switch.mid{display:flex}
}
@media (max-width:899px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .cols .col{display:none!important}
  .cols[data-view="pelapor"] .col-pelapor,.cols[data-view="notif"] .col-notif,.cols[data-view="admin"] .col-admin{display:block!important}
  .switch.mid{display:none}
  .switch.small{display:flex}
  .flow{grid-template-columns:minmax(0,1fr)}
  .guide{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}
  .step span{display:none}
  .step .dot{width:32px;height:32px}
  .step::before{top:15px;left:calc(-50% + 16px);right:calc(50% + 16px)}
}

/* Phone */
.device{background:var(--bezel);border-radius:44px;padding:10px;box-shadow:var(--shadow-pop)}
.screen{background:var(--page);border-radius:34px;overflow:hidden;height:800px;display:flex;flex-direction:column}
.addr{display:flex;align-items:center;gap:6px;margin:10px 14px 6px;padding:6px 12px;border-radius:9999px;background:var(--slate-100);font-size:12px;line-height:16px;color:var(--slate-600);min-width:0}
.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apphead{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.apphead b{display:block;font-weight:800;font-size:15px;line-height:20px}
.pbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.pnav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px 10px}
.pnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:var(--r-lg);font-size:11px;line-height:14px;font-weight:600;color:var(--muted)}
.pnav button[aria-current="true"]{color:var(--brand-text)}
@media (max-width:899px){
  .device{background:none;padding:0;border-radius:0;box-shadow:none}
  .screen{height:auto;min-height:640px;border-radius:var(--r-2xl);border:1px solid var(--line)}
  .pbody{overflow:visible}
}
.viewfinder{position:relative;height:200px;border-radius:var(--r-2xl);background:var(--viewfinder);overflow:hidden;display:grid;place-items:center}
.viewfinder .frame{width:140px;height:140px;border-radius:18px;border:3px solid var(--brand-400);position:relative}
.viewfinder .line{position:absolute;left:8px;right:8px;height:2px;background:var(--brand-400);top:10%;animation:scan 2.2s ease-in-out infinite alternate}
.viewfinder p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--on-dark);font-size:12px;font-weight:600}
@keyframes scan{to{top:88%}}
@media (prefers-reduced-motion: reduce){.viewfinder .line{animation:none;top:50%}}
.floor{display:flex;flex-direction:column;gap:8px}
.floor h3{font-size:12px;line-height:16px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.locgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.locbtn{display:flex;align-items:center;gap:8px;text-align:left;padding:10px;border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12px;line-height:16px}
.locbtn:hover{border-color:var(--brand-300);background:var(--brand-50)}
.locbtn .ic{color:var(--brand-text)}
.lockloc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-xl);background:var(--brand-50);border:1px solid var(--brand-200)}
.lockloc .pin{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--brand-text);flex:none}
.lockloc b{display:block;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:9px 10px;border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-text)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{padding:7px 12px;border-radius:9999px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:16px;font-weight:600;color:var(--slate-700)}
.qchip:hover{border-color:var(--brand-300)}
.qchip[aria-pressed="true"]{background:var(--brand-500);border-color:var(--brand-500);color:#ffffff}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);background:var(--slate-100)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:9999px;background:var(--slate-900);color:#ffffff;display:grid;place-items:center}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.ph.add:hover{border-color:var(--brand-400);color:var(--brand-text)}
.idbox{display:flex;gap:10px;align-items:center;padding:12px;border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface)}
.avatar{width:36px;height:36px;border-radius:9999px;background:var(--slate-100);color:var(--slate-600);display:grid;place-items:center;font-weight:700;flex:none}
.bigcheck{width:64px;height:64px;border-radius:9999px;background:var(--emerald-50);border:1px solid var(--emerald-200);color:var(--emerald-text);display:grid;place-items:center;margin:8px auto 0}
.code{font-weight:800;font-size:22px;line-height:28px;letter-spacing:.02em}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{width:24px;height:24px;border-radius:9999px;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--slate-400)}
.tl li.ok .d{background:var(--emerald-50);border-color:var(--emerald-200);color:var(--emerald-text)}
.tl li.now .d{background:var(--brand-50);border-color:var(--brand-400);color:var(--brand-text)}
.tl b{font-weight:700;display:block}
.stars{display:flex;gap:4px}
.stars button{color:var(--slate-400);padding:2px}
.stars button[aria-pressed="true"]{color:var(--brand-500)}
.stars .fill path{fill:currentColor}
.ticketcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:var(--r-xl);border:1px solid var(--line);background:var(--surface);width:100%}
.ticketcard:hover{border-color:var(--brand-300)}

/* Notifications */
.nlist{display:flex;flex-direction:column;gap:10px;max-height:820px;overflow:auto;padding:2px}
.nlist>*{flex:none}
@media (max-width:899px){.nlist{max-height:none;overflow:visible}}
.notif{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);overflow:hidden}
.notif.fresh{border-color:var(--brand-300);box-shadow:0 0 0 3px var(--brand-100)}
.nhead{display:flex;align-items:center;gap:8px;padding:10px 12px;width:100%;text-align:left}
.nhead .chan{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.chan.email{background:var(--sky-50);color:var(--sky-text)}
.chan.tg{background:var(--violet-50);color:var(--violet-text)}
.nhead .t{min-width:0;flex:1}
.nhead .t b{display:block;font-size:12px;line-height:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbody{padding:0 12px 12px}
.mail{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.mail .mh{padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;line-height:16px;color:var(--muted)}
.mail .mh b{color:var(--ink);font-weight:600}
.mail .mb{padding:12px;display:flex;flex-direction:column;gap:10px}
.mail .brandbar{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--brand-500);font-weight:800}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 8px;font-size:12px;line-height:16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tgwrap{background:var(--slate-100);border-radius:var(--r-lg);padding:10px}
.bubble{background:var(--surface);border-radius:12px 12px 12px 4px;padding:8px 10px;font-size:12px;line-height:18px;max-width:100%;box-shadow:var(--shadow-card)}
.bubble .bot{font-weight:700;color:var(--violet-text);font-size:11px}
.bubble p{white-space:pre-line}
.tgbtns{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.tgbtns button{background:var(--surface);border-radius:8px;padding:7px 6px;font-size:12px;font-weight:600;color:var(--violet-text);box-shadow:var(--shadow-card)}
.tgbtns button:hover:not([disabled]){background:var(--violet-50)}
.tgbtns button[disabled]{color:var(--muted);cursor:default}

/* Admin */
.adminbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.adminbar .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.abody{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r-xl);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;line-height:32px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;line-height:16px;color:var(--muted);font-weight:600}
.kpi.alert{border-color:var(--amber-200);background:var(--amber-50)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:14px;line-height:20px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:112px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12px;line-height:16px}
.bar .track{height:10px;border-radius:9999px;background:var(--slate-100);overflow:hidden}
.bar .fillb{height:100%;border-radius:9999px;background:var(--brand-500)}
.bar .fillb.hk{background:var(--sky-text)} .bar .fillb.it{background:var(--violet-text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sflow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sflow .ic{color:var(--slate-400)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-width:0}
.kcol{flex:0 0 212px;background:var(--slate-50);border:1px solid var(--line);border-radius:var(--r-xl);padding:8px;display:flex;flex-direction:column;gap:8px}
.kcol>header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.kcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.kcard:hover{border-color:var(--brand-300)}
.kcard.demo{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.kcard .c{font-size:11px;font-weight:700;color:var(--muted)}
.kcard b{font-size:13px;line-height:18px;font-weight:700}
.kempty{font-size:12px;color:var(--slate-400);text-align:center;padding:10px 0}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:20px;line-height:28px;font-weight:800}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;line-height:18px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.actions{border:1px solid var(--brand-200);background:var(--brand-50);border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:12px}
.actions h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.audit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:16px}
.audit li{display:grid;grid-template-columns:86px 1fr;gap:8px}
.audit time{color:var(--muted);font-variant-numeric:tabular-nums}
.radio{display:flex;gap:6px}
.radio button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.radio button[aria-pressed="true"]{border-color:var(--brand-500);color:var(--brand-text);background:var(--surface)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.sticker{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:var(--r-xl);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer}
.sticker:hover{border-color:var(--brand-400)}
.sticker .top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px}
.sticker .bot{border-top:2px solid #f97316;padding-top:6px;width:100%}
.sticker .bot b{display:block;font-size:13px;line-height:18px}
.sticker .bot span{font-size:10px;color:#475569}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-xl)}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:18px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--slate-50)}
tr:last-child td{border-bottom:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 12px;text-align:center;color:var(--muted)}
.empty .ei{width:44px;height:44px;border-radius:9999px;background:var(--slate-100);display:grid;place-items:center;color:var(--slate-600)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--slate-900);color:#ffffff;padding:10px 16px;border-radius:var(--r-xl);font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-pop);max-width:calc(100vw - 32px)}
.toast .ic{color:#6ee7b7}
.note{font-size:12px;line-height:16px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
</style>

/* ---------- Waktu & format ---------- */
const WORK = { days:[1,2,3,4,5], start:9, end:16 };
const isWorkday = d => WORK.days.includes(d.getDay());
function addWorkDays(ms, n) { const d = new Date(ms); let c = 0; while (c < n) { d.setDate(d.getDate() + 1); if (isWorkday(d)) c++; } return d.getTime(); }
function workdaysAgo(n, h, m) { const d = new Date(); d.setHours(h, m, 0, 0); let c = 0; while (c < n) { d.setDate(d.getDate() - 1); if (isWorkday(d)) c++; } return d.getTime(); }
function nextWorkSlot(ms, hour) { const d = new Date(ms); d.setDate(d.getDate() + 1); while (!isWorkday(d)) d.setDate(d.getDate() + 1); d.setHours(hour, 0, 0, 0); return d.getTime(); }
function workHoursBetween(a, b) {
  if (b <= a) return 0; let total = 0; const d = new Date(a); d.setHours(0, 0, 0, 0);
  while (d.getTime() < b) {
    if (isWorkday(d)) { const s = new Date(d); s.setHours(WORK.start, 0, 0, 0); const e = new Date(d); e.setHours(WORK.end, 0, 0, 0);
      const lo = Math.max(a, s.getTime()), hi = Math.min(b, e.getTime()); if (hi > lo) total += hi - lo; }
    d.setDate(d.getDate() + 1);
  }
  return total / 3600000;
}
const minsAgo = m => Date.now() - m * 60000;
const fmtDT = ms => new Intl.DateTimeFormat('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }).format(ms);
const fmtDay = ms => new Intl.DateTimeFormat('id-ID', { weekday:'long', day:'numeric', month:'long' }).format(ms);
const fmtTime = ms => new Intl.DateTimeFormat('id-ID', { hour:'2-digit', minute:'2-digit' }).format(ms);
const fmtRp = n => 'Rp ' + new Intl.NumberFormat('id-ID').format(n || 0);
const fmtKB = b => Math.max(1, Math.round(b / 1024)) + ' KB';
function relTime(ms) { const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return 'baru saja'; if (m < 60) return m + ' menit lalu'; const h = Math.round(m / 60); if (h < 24) return h + ' jam lalu'; return Math.round(h / 24) + ' hari lalu'; }
const pad = n => String(n).padStart(2, '0');
const toInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const yymm = (() => { const d = new Date(); return String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1); })();

function samplePhoto(label, after) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480; const g = c.getContext('2d');
  g.fillStyle = after ? '#d1fae5' : '#e2e8f0'; g.fillRect(0, 0, 640, 480);
  g.strokeStyle = after ? '#a7f3d0' : '#cbd5e1'; g.lineWidth = 2;
  for (let x = 0; x <= 640; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 480); g.stroke(); }
  for (let y = 0; y <= 480; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(640, y); g.stroke(); }
  g.fillStyle = after ? '#047857' : '#475569'; g.font = '700 30px "Plus Jakarta Sans", sans-serif'; g.textAlign = 'center';
  g.fillText(after ? 'FOTO SESUDAH' : 'FOTO LAPORAN', 320, 220); g.font = '500 24px "Plus Jakarta Sans", sans-serif'; g.fillText(label, 320, 262);
  const url = c.toDataURL('image/jpeg', 0.7); return { url, size: Math.round(url.length * 0.75), sample: true };
}
function compressFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.72); res({ url, size: Math.round(url.length * 0.75), orig: file.size }); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

        [{ label:'Terima', act:'accept' }, { label:'Ambil tiket', act:'take' }]),
    ];
    case 'accepted': return [tg(`${t.code} diterima`, `Ditangani ${x.by}${t.assignee ? ', pelaksana ' + t.assignee : ''}.`)];
    case 'reassigned': return [tg(`Tiket dialihkan ke ${team.name}: ${t.code}`, `${locLabel(loc)}\n${cat.name} · ${t.issue || '-'}\n"${t.desc || t.issue}"`, [{ label:'Terima', act:'accept' }, { label:'Ambil tiket', act:'take' }])];
    case 'scheduled': return [
      tg(`${t.code} dijadwalkan`, `${fmtDay(t.schedule)} pukul ${fmtTime(t.schedule)}\nPelaksana: ${t.exec === 'vendor' ? t.vendor + ' (vendor)' : t.assignee}${t.cost ? '\nEstimasi biaya: ' + fmtRp(t.cost) : ''}`),
      ...(toReporter ? [mail(toReporter, `Laporan Anda dijadwalkan: ${t.code}`, `Halo ${t.reporter.nama}, laporan Anda di ${locLabel(loc)} sudah dijadwalkan.`, [['Jadwal', `${fmtDay(t.schedule)}, ${fmtTime(t.schedule)}`], ['Pelaksana', t.exec === 'vendor' ? t.vendor : 'Tim ' + team.name], ['Status', `${DOMAIN}/t/${t.code}`]], 'Lihat status')] : []),
    ];
    case 'approval': return [
      mail(OPS_EMAIL + ' · ' + OPS, `Perlu persetujuan biaya ${fmtRp(t.cost)}: ${t.code}`, `Biaya perbaikan melebihi ambang ${fmtRp(THRESHOLD)} dan perlu persetujuan Ops Manager.`, [['Lokasi', locLabel(loc)], ['Masalah', t.issue || cat.name], ['Vendor', t.vendor || 'Internal'], ['Estimasi', fmtRp(t.cost)], ['Diajukan', x.by]], 'Tinjau'),
      { ...tg(`Persetujuan biaya ${t.code}`, `${locLabel(loc)} · ${t.issue || cat.name}\nVendor: ${t.vendor || 'Internal'}\nEstimasi: ${fmtRp(t.cost)}\nDiajukan: ${x.by}`, [{ label:'Setujui', act:'approve' }, { label:'Tolak', act:'deny' }]), to: 'Pesan pribadi · ' + OPS },
    ];
    case 'approved': return [tg(`Biaya ${t.code} disetujui`, `${fmtRp(t.cost)} disetujui ${OPS}. Tiket lanjut dijadwalkan.`)];
    case 'denied': return [tg(`Biaya ${t.code} ditolak`, `${OPS} menolak estimasi ${fmtRp(t.cost)}. Cari alternatif vendor/solusi.`)];
    case 'done': return [
      tg(`${t.code} selesai dikerjakan`, `Foto sesudah sudah diunggah. Menunggu konfirmasi pelapor (otomatis Closed ${fmtDay(t.autoCloseAt)}).`),
      ...(toReporter ? [mail(toReporter, `Mohon konfirmasi: ${t.code} selesai dikerjakan`, `Halo ${t.reporter.nama}, perbaikan di ${locLabel(loc)} sudah selesai. Mohon konfirmasi dan beri penilaian.`, [['Catatan', t.doneNote || '-'], ['Konfirmasi', `${DOMAIN}/t/${t.code}`], ['Batas', 'Otomatis Closed ' + fmtDay(t.autoCloseAt)]], 'Konfirmasi')] : []),
    ];
    case 'reopened': return [tg(`${t.code} dibuka lagi oleh pelapor`, `"${x.note || 'Masalah belum beres.'}"`)];
    case 'closed': return [tg(`${t.code} Closed`, x.auto ? `Tanpa respons pelapor ${AUTO_CLOSE_DAYS} hari kerja, ditutup otomatis.` : `Pelapor konfirmasi sudah beres. Rating ${t.rating}/5${t.feedback ? '\n"' + t.feedback + '"' : ''}`)];
    case 'metoo': return [tg(`+1 laporan serupa ${t.code}`, `${x.nama} juga mengalami ${(t.issue || cat.name).toLowerCase()} di ${locLabel(loc)}. Total ${t.meToo + 1} orang.`)];

}

    { loc:'L4-MUSALA', cat:'kebersihan', issue:'Karpet/sajadah kotor', desc:'Karpet saf depan kotor dan bau.', r:'maya', flow:[['BARU',minsAgo(35)]] },
    { loc:'L3-CEO', cat:'ac', issue:'AC tidak dingin', desc:'AC ruangan tidak dingin, ada tamu jam 14.00.', r:'nadia', flow:[['BARU',minsAgo(18)]] },
  ];
  const tickets = defs.map((d, i) => {
    const rep = PEOPLE[d.r]; const team = CATS[d.cat].team; const created = d.flow[0][1];
    const events = []; let prev = null;
    d.flow.forEach(([to, at, text], j) => {
      const actor = j === 0 ? rep.nama + ' (pelapor)' : to === 'CLOSED' ? rep.nama + ' (pelapor)' : to === 'MENUNGGU' && d.waitReason === 'approval' ? adminOf(team) : adminOf(team);
      events.push({ at, actor, text: j === 0 ? 'Laporan dibuat lewat QR ' + d.loc : text, from: prev, to }); prev = to;
    });
    (d.extra || []).forEach(([at, actor, text]) => events.push({ at, actor, text, from: null, to: null }));
    events.sort((a, b) => a.at - b.at);
    const doneAt = (d.flow.find(f => f[0] === 'SELESAI') || [])[1];
    const t = {
      id: 's' + (i + 1), code: mkCode(i + 1), loc: d.loc, cat: d.cat, jenis: d.jenis || jenisFor(d.cat), issue: d.issue, desc: d.desc,
      photos: [{ ...samplePhoto(d.issue || 'Permintaan'), fase: 'before' }], reporter: rep, status: d.flow[d.flow.length - 1][0], waitReason: d.waitReason || '',
      team, assignee: d.assignee || '', exec: d.exec || 'internal', vendor: d.vendor || '', cost: d.cost || 0, approval: d.approval || null,
      schedule: d.schedule || null, rating: d.rating || null, feedback: d.feedback || '', meToo: d.meToo || 0, createdAt: created, events,
      rejectReason: d.rejectReason || '', doneNote: d.doneNote || '', autoCloseAt: doneAt ? addWorkDays(doneAt, AUTO_CLOSE_DAYS) : null, mine: !!d.mine, parent: null,
    };
    if (d.afterPhoto || ['SELESAI','CLOSED'].includes(t.status)) t.photos.push({ ...samplePhoto(d.doneNote || 'Pekerjaan selesai', true), fase: 'after' });
    return t;
  });
  const notifs = [];
  const byId = Object.fromEntries(tickets.map(t => [t.id, t]));
  notifs.push(...makeNotifs('approval', byId.s7, { at: workdaysAgo(1, 14, 0), by: adminOf('ga') }));
  notifs.push(...makeNotifs('new', byId.s11, { at: minsAgo(35) }));
  notifs.push(...makeNotifs('new', byId.s12, { at: minsAgo(18) }));
  notifs.sort((a, b) => b.at - a.at);
  return { tickets, notifs };
}

const Ctx = createContext(null);

function Chip({ status, children }) {
  const s = ST[status]; return html`<span className=${'chip ' + (s ? s.tone : '')}>${children || s.label}</span>`;
}
function statusText(t) {
  if (t.status === 'MENUNGGU') return t.waitReason === 'approval' ? 'Menunggu approval' : 'Menunggu part/vendor';
  return ST[t.status].label;
}

/* ---------- QR ---------- */
function QR({ text, size = 120 }) {
  const m = useMemo(() => {
    if (!window.qrcode) return null;
    try { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`; return { n, d }; } catch (e) { return null; }
  }, [text]);
  if (!m) return html`<div style=${{ width:size, height:size, display:'grid', placeItems:'center', border:'1px dashed #94a3b8', borderRadius:8, fontSize:11 }}>QR</div>`;
  return html`<svg width=${size} height=${size} viewBox=${`-2 -2 ${m.n + 4} ${m.n + 4}`} shapeRendering="crispEdges" role="img" aria-label=${'Kode QR ' + text}>
    <rect x="-2" y="-2" width=${m.n + 4} height=${m.n + 4} style=${{ fill:'#ffffff' }}></rect><path d=${m.d} style=${{ fill:'#0f172a' }}></path></svg>`;
}

function CopyLink({ text }) {
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  function copy() {
    const ok = () => { setDone(true); setTimeout(() => setDone(false), 1500); };
    try { navigator.clipboard.writeText('https://' + text).then(ok, () => select()); } catch (e) { select(); }
  }
  function select() { const r = document.createRange(); r.selectNodeContents(ref.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  return html`<div className="idbox" style=${{ textAlign:'left' }}><${Icon} name="lock" size=${14} className="muted" /><span ref=${ref} style=${{ flex:1, minWidth:0, fontSize:12, overflowWrap:'anywhere' }}>${text}</span>
    <button className="btn btn-ghost btn-sm" onClick=${copy}><${Icon} name=${done ? 'check' : 'copy'} size=${14} />${done ? 'Tersalin' : 'Salin'}</button></div>`;
}

function NotifCard({ n, open }) {
  const { db, act, openTicket } = useApp();
  const [exp, setExp] = useState(open);
  useEffect(() => { if (open) setExp(true); }, [open]);
  const t = db.tickets.find(x => x.id === n.ticketId);
  const can = a => t && ((a === 'accept' || a === 'take') ? t.status === 'BARU' : (a === 'approve' || a === 'deny') ? t.approval === 'pending' : true);

    if (!t) return '';

  return html`<article className=${'notif' + (n.fresh ? ' fresh' : '')}>
    <button className="nhead" onClick=${() => setExp(!exp)} aria-expanded=${String(exp)}>
      <span className=${'chan ' + (n.ch === 'email' ? 'email' : 'tg')}><${Icon} name=${n.ch === 'email' ? 'mail' : 'msg'} size=${15} /></span>
      <span className="t"><b>${n.ch === 'email' ? n.subject : n.title}</b><span className="caption">${n.ch === 'email' ? 'Email' : 'Telegram'} · ${n.to} · ${fmtTime(n.at)}</span></span>

    ${exp && html`<div className="nbody">${n.ch === 'email' ? html`<div className="mail">

        <div className="mb"><div className="brandbar"><div className="logo sm"><img src=${LOGO} alt="" /></div>Tiket Fasilitas HQ</div>
          <p style=${{ fontSize:12, lineHeight:'18px' }}>${n.intro}</p>
          <dl className="kv">${n.fields.map(([k, v]) => html`<${React.Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`)}</dl>

  const avgResp = resp.length ? resp.reduce((s, x) => s + x, 0) / resp.length : 0;

      <div className="kpi"><span className="l">Biaya perbaikan</span><span className="v" style=${{ fontSize:20 }}>${fmtRp(cost)}</span></div>
    </div>
    ${pending.length > 0 && html`<div className="callout amber"><${Icon} name="shield" /><div style=${{ flex:1 }}><b>${pending.length} biaya menunggu persetujuan ${OPS}.</b> ${pending.map(t => html`<button key=${t.id} className="linkbtn" style=${{ marginLeft:6 }} onClick=${() => openTicket(t.id)}>${t.code} · ${fmtRp(t.cost)}</button>`)}</div></div>`}

      <section className="panel"><h3>Tiket per kategori</h3>
        <div className="bars">${byCat.map(([k, c, n]) => html`<div className="bar" key=${k}><span>${c.name}</span><div className="track"><div className=${'fillb ' + c.team} style=${{ width: (n / maxCat * 100) + '%' }}></div></div><span className="num" style=${{ textAlign:'right', fontWeight:700 }}>${n}</span></div>`)}</div>
        <div className="legend"><span><i style=${{ background:'var(--brand-500)' }}></i>GA</span><span><i style=${{ background:'var(--violet-text)' }}></i>IT</span><span><i style=${{ background:'var(--sky-text)' }}></i>Housekeeping</span></div>

          <div className="row"><button className="btn btn-primary" disabled=${!after} onClick=${() => act.finish(t.id, after, doneNote)}>Tandai selesai</button>
            <button className="btn btn-secondary" onClick=${() => act.hold(t.id)}>Tunda: menunggu part</button></div>
          ${!after && html`<span className="caption">Tombol aktif setelah foto sesudah diunggah.</span>`}
        </div>`}

        ${t.status === 'SELESAI' && html`<div className="actions"><h3><${Icon} name="clock" />Menunggu konfirmasi pelapor</h3>
          <p>Otomatis Closed ${fmtDay(t.autoCloseAt)} jika pelapor tidak merespons.</p>
          <button className="btn btn-secondary" onClick=${() => act.autoClose(t.id)}>Simulasikan ${AUTO_CLOSE_DAYS} hari kerja berlalu</button></div>`}
      </div>
      <section className="panel"><h3><${Icon} name="history" size=${14} /> Riwayat (audit trail)</h3>
        <ol className="audit">${[...t.events].reverse().map((e, i) => html`<li key=${i}><time>${fmtDT(e.at)}</time><div><b>${e.actor}</b><div className="muted">${e.text}${e.to && e.from ? ` (${ST[e.from].label} → ${ST[e.to].label})` : ''}</div></div></li>`)}</ol>
      </section>
    </div>
  <//>`;
}

/* ================= STEPPER & PEMANDU ================= */
const STEPS = [['Scan QR','scan','Stiker per lokasi'],['Isi form','form','Lokasi otomatis'],['Submit','send','Kode tiket'],['Email + Telegram','bell','Ke admin & tim'],['FU & jadwal','calendar','Admin tindak lanjut'],['Closed','checkc','Konfirmasi pelapor']];

function Flow() {
  const { stepInfo, demoNext, resetDemo } = useApp();
  const { step, allDone, title, text, action } = stepInfo;
  return html`<section className="card flow" aria-label="Alur proses">
    <ol className="steps">${STEPS.map(([label, ic, sub], i) => {
      const n = i + 1; const cls = allDone || n < step ? 'done' : n === step ? 'current' : 'todo';
      return html`<li key=${label} className=${'step ' + cls} aria-current=${cls === 'current' ? 'step' : undefined}><span className="dot"><${Icon} name=${cls === 'done' ? 'check' : ic} size=${18} /></span><b>${label}</b><span>${sub}</span></li>`;
    })}</ol>
    <div className="guide">
      <span className="eyebrow">${allDone ? 'Selesai' : `Langkah ${step} dari 6`} · ${title}</span>
      <p>${text}</p>
      <div className="row"><button className="btn btn-primary" onClick=${demoNext}><${Icon} name=${allDone ? 'reset' : 'play'} size=${14} />${action}</button>
        ${!allDone && html`<button className="btn btn-ghost btn-sm" onClick=${resetDemo}>Mulai ulang</button>`}</div>
    </div>
  </section>`;
}

/* ================= APP ================= */
function App() {
  const [db, setDb] = useState(seed);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('tiket-tema') || 'system'; } catch (e) { return 'system'; } });
  const [view, setView] = useState('pelapor');
  const [right, setRight] = useState('admin');
  const [phone, setPhone] = useState({ screen:'scan', loc:null, ticketId:null });
  const [form, setForm] = useState(emptyForm);
  const [adminTab, setAdminTab] = useState('tiket');
  const [selId, setSelId] = useState(null);
  const [demoId, setDemoId] = useState(null);
  const [toast, setToast] = useState(null);
  const seqRef = useRef(12);
  const toastTimer = useRef(null);

  useEffect(() => {
    const el = document.documentElement;
    if (theme === 'system') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', theme);
    try { localStorage.setItem('tiket-tema', theme); } catch (e) {}
  }, [theme]);
  useEffect(() => { const id = setTimeout(() => setDb(d => d.notifs.some(n => n.fresh) ? { ...d, notifs: d.notifs.map(n => n.fresh ? { ...n, fresh:false } : n) } : d), 6000); return () => clearTimeout(id); }, [db.notifs]);

  function say(msg) { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 3200); }
  function show(panel) { setView(panel); if (panel !== 'pelapor') setRight(panel); }
  function update(id, fn) {
    setDb(prev => {
      const tickets = prev.tickets.map(t => t.id === id ? { ...t, events:[...t.events], photos:[...t.photos] } : t);
      const t = tickets.find(x => x.id === id); const out = fn(t, tickets) || [];
      return { tickets, notifs: [...out, ...prev.notifs] };
    });
  }
  const ev = (t, actor, text, to) => { t.events.push({ at: Date.now(), actor, text, from: to ? t.status : null, to: to || null }); if (to) t.status = to; };

  const act = {
    accept(id, who) { update(id, t => { const by = adminOf(t.team); t.assignee = who || t.assignee || TEAMS[t.team].staff[0]; ev(t, by, `Tiket diterima, pelaksana ${t.assignee}`, 'DITERIMA'); return makeNotifs('accepted', t, { by: TEAMS[t.team].admin }); }); say('Tiket diterima'); },
    fromTelegram(id, a) {
      if (a === 'approve') return act.approve(id); if (a === 'deny') return act.deny(id);
      update(id, t => { const by = adminOf(t.team); t.assignee = t.assignee || TEAMS[t.team].staff[0]; ev(t, by, a === 'take' ? `Diambil lewat Telegram, pelaksana ${t.assignee}` : `Diterima lewat Telegram, pelaksana ${t.assignee}`, 'DITERIMA'); return makeNotifs('accepted', t, { by: TEAMS[t.team].admin }); });
      setSelId(id); setAdminTab('tiket'); say('Diterima dari Telegram');
    },
    reassign(id, team) { update(id, t => { const from = TEAMS[t.team].name; ev(t, adminOf(t.team), `Dialihkan dari Tim ${from} ke Tim ${TEAMS[team].name}`); t.team = team; t.assignee = ''; return makeNotifs('reassigned', t); }); say('Tiket dialihkan'); },
    reject(id, reason) { update(id, t => { t.rejectReason = reason; ev(t, adminOf(t.team), 'Ditolak: ' + reason, 'DITOLAK'); return makeNotifs('rejected', t); }); say('Tiket ditolak'); },
    duplicate(id, parentId) {
      setDb(prev => {
        const tickets = prev.tickets.map(t => ({ ...t, events:[...t.events] }));
        const t = tickets.find(x => x.id === id), p = tickets.find(x => x.id === parentId);
        t.parent = parentId; ev(t, adminOf(t.team), 'Digabung ke ' + p.code, 'DUPLIKAT'); p.meToo += 1 + t.meToo; ev(p, adminOf(p.team), `Tiket ${t.code} digabung ke sini`);
        return { ...prev, tickets };
      }); say('Ditandai duplikat');
    },
    schedule(id, s) {
      update(id, t => {
        t.exec = s.exec; t.vendor = s.exec === 'vendor' ? s.vendor.trim() : ''; t.assignee = s.exec === 'vendor' ? s.vendor.trim() : s.who; t.cost = s.cost; t.schedule = s.when;
        const by = adminOf(t.team);
        if (s.cost > THRESHOLD) { t.approval = 'pending'; t.waitReason = 'approval'; ev(t, by, `Estimasi ${fmtRp(s.cost)} diajukan ke ${OPS}`, 'MENUNGGU'); return makeNotifs('approval', t, { by }); }
        ev(t, by, `Dijadwalkan ${fmtDT(s.when)}, ${s.exec === 'vendor' ? 'vendor ' + t.vendor : 'teknisi ' + s.who}`, 'DIJADWALKAN'); return makeNotifs('scheduled', t);
      });
      say(s.cost > THRESHOLD ? 'Diajukan ke Ops Manager' : 'Jadwal tersimpan, pelapor diberi tahu');
    },
    approve(id) { update(id, t => { t.approval = 'approved'; t.waitReason = ''; ev(t, OPS, `Biaya ${fmtRp(t.cost)} disetujui`, 'DIJADWALKAN'); if (!t.schedule) t.schedule = nextWorkSlot(Date.now(), 10); return [...makeNotifs('approved', t), ...makeNotifs('scheduled', t)]; }); say('Biaya disetujui'); },
    deny(id) { update(id, t => { t.approval = 'denied'; t.waitReason = ''; ev(t, OPS, `Biaya ${fmtRp(t.cost)} ditolak, cari alternatif`, 'DITERIMA'); return makeNotifs('denied', t); }); say('Biaya ditolak'); },
    start(id) { update(id, t => { ev(t, adminOf(t.team), 'Mulai dikerjakan oleh ' + t.assignee, 'DIKERJAKAN'); }); say('Status: Dikerjakan'); },
    hold(id) { update(id, t => { t.waitReason = 'part'; ev(t, adminOf(t.team), 'Ditunda, menunggu part/vendor', 'MENUNGGU'); }); say('Status: Menunggu part'); },
    resume(id) { update(id, t => { t.waitReason = ''; ev(t, adminOf(t.team), 'Pekerjaan dilanjutkan', 'DIKERJAKAN'); }); },
    finish(id, photo, note) { update(id, t => { t.photos.push({ ...photo, fase:'after' }); t.doneNote = note || 'Pekerjaan selesai'; t.autoCloseAt = addWorkDays(Date.now(), AUTO_CLOSE_DAYS); ev(t, adminOf(t.team), 'Selesai: ' + t.doneNote + ' (foto sesudah diunggah)', 'SELESAI'); return makeNotifs('done', t); }); say('Selesai, pelapor diminta konfirmasi'); },
    autoClose(id) { update(id, t => { ev(t, 'Sistem', `Tanpa respons ${AUTO_CLOSE_DAYS} hari kerja, ditutup otomatis`, 'CLOSED'); return makeNotifs('closed', t, { auto:true }); }); say('Tiket Closed otomatis'); },
  };
  function confirm(id, rating, fb) { update(id, t => { t.rating = rating; t.feedback = fb.trim(); ev(t, t.reporter.nama + ' (pelapor)', `Konfirmasi sudah beres, rating ${rating}/5`, 'CLOSED'); return makeNotifs('closed', t); }); say('Terima kasih, tiket Closed'); }
  function reopen(id, note) { update(id, t => { ev(t, t.reporter.nama + ' (pelapor)', 'Belum beres: ' + (note.trim() || '-'), 'DIKERJAKAN'); t.photos = t.photos.filter(p => p.fase !== 'after'); return makeNotifs('reopened', t, { note: note.trim() }); }); say('Dikirim ke tim'); }

  function scan(code) { setPhone({ screen:'form', loc:code, ticketId:null }); setForm(emptyForm()); show('pelapor'); }
  function validate(f) {
    const e = {};
    if (!f.cat) e.cat = 'Pilih kategori.';
    if (!f.issue && f.desc.trim().length < 10) e.desc = 'Tulis minimal 10 karakter atau pilih masalah umum.';
    if (!f.nama.trim()) e.nama = 'Nama wajib diisi.';
    if (f.wa.replace(/\D/g, '').length < 10) e.wa = 'No WhatsApp minimal 10 digit.';
    return e;
  }
  function submit() {
    const f = form; const e = validate(f);
    if (Object.keys(e).length) { setForm({ ...f, errors: e, editId: f.editId || !!(e.nama || e.wa) }); return null; }
    const n = ++seqRef.current; const id = 'u' + n; const loc = LOC[phone.loc]; const team = CATS[f.cat].team; const now = Date.now();
    const t = { id, code: mkCode(n), loc: loc.code, cat: f.cat, jenis: f.jenis || jenisFor(f.cat), issue: f.issue, desc: f.desc.trim(), photos: f.photos.map(p => ({ ...p, fase:'before' })),
      reporter: { nama: f.nama.trim(), divisi: f.divisi, wa: f.wa.trim(), email: f.email.trim() }, status:'BARU', waitReason:'', team, assignee:'', exec:'internal', vendor:'', cost:0, approval:null,
      schedule:null, rating:null, feedback:'', meToo:0, createdAt: now, events:[{ at: now, actor: f.nama.trim() + ' (pelapor)', text: 'Laporan dibuat lewat QR ' + loc.code, from:null, to:'BARU' }], rejectReason:'', doneNote:'', autoCloseAt:null, mine:true, parent:null };
    setDb(prev => ({ tickets: [...prev.tickets, t], notifs: [...makeNotifs('new', t), ...prev.notifs] }));
    Object.assign(SAVED_ID, { nama: t.reporter.nama, divisi: t.reporter.divisi, wa: t.reporter.wa, email: t.reporter.email });
    setPhone({ screen:'success', loc: loc.code, ticketId: id }); setDemoId(id); setSelId(id); setAdminTab('tiket'); setForm(emptyForm());
    say(`Email ke ${OPS_EMAIL} dan Telegram ke ${TEAMS[team].group} terkirim`);
    return id;
  }
  function meToo(id) {
    update(id, t => { t.meToo += 1; t.mine = true; ev(t, form.nama + ' (pelapor)', 'Saya juga mengalami (+1)'); return makeNotifs('metoo', t, { nama: form.nama }); });
    setPhone({ screen:'success', loc: phone.loc, ticketId: id, metoo:true }); setForm(emptyForm()); say('Tercatat sebagai laporan serupa');
  }
  function openTicket(id) { setSelId(id); setAdminTab('tiket'); show('admin'); }

  /* Pemandu alur */
  const demoT = db.tickets.find(t => t.id === demoId);
  const stepInfo = (() => {
    if (!demoT) {
      if (phone.screen === 'form') {
        const ready = form.cat && (form.issue || form.desc.trim().length >= 10);
        return { step: 2, title:'Isi form', text:`Lokasi ${LOC[phone.loc].name} Lt ${LOC[phone.loc].floor} terisi otomatis dari QR. Pelapor cukup pilih masalah umum, tambah foto, lalu kirim. Identitas diingat di HP, tanpa login.`, action: ready ? 'Kirim laporan' : 'Isi form contoh' };
      }
      return { step: 1, title:'Scan QR', text:'Karyawan memindai stiker QR yang ditempel di area. Pilih stiker di layar HP atau di tab Stiker QR pada panel admin.', action:'Scan QR Toilet Pria (Urinoir) Lt 1' };
    }
    const s = demoT.status, code = demoT.code, team = TEAMS[demoT.team];
    if (s === 'BARU') return { step: 4, title:'Notifikasi', text:`${code} masuk dengan status Baru. Email terkirim ke ${OPS_EMAIL} dan Telegram ke grup ${team.group}. Admin bisa langsung menekan Terima dari Telegram.`, action:'Admin tekan Terima di Telegram' };
    if (s === 'DITERIMA') return { step: 5, title:'Follow up & jadwal', text:`Admin menentukan jadwal dan pelaksana (internal atau vendor). Biaya di atas ${fmtRp(THRESHOLD)} otomatis meminta persetujuan Ops Manager.`, action:`Jadwalkan ${fmtDay(nextWorkSlot(Date.now(), 10)).split(',')[0]} 10.00` };
    if (s === 'MENUNGGU') return { step: 5, title:'Menunggu', text: demoT.waitReason === 'approval' ? `Estimasi ${fmtRp(demoT.cost)} menunggu persetujuan ${OPS}.` : 'Pekerjaan ditunda menunggu part atau vendor.', action: demoT.waitReason === 'approval' ? 'Ops Manager menyetujui' : 'Lanjutkan pekerjaan' };
    if (s === 'DIJADWALKAN') return { step: 5, title:'Follow up & jadwal', text:'Pelapor menerima kabar jadwal lewat email dan halaman status. Di hari H, pelaksana menandai mulai dikerjakan.', action:'Mulai dikerjakan' };
    if (s === 'DIKERJAKAN') return { step: 5, title:'Pengerjaan', text:'Setelah selesai, pelaksana wajib mengunggah foto sesudah sebagai bukti.', action:'Unggah foto sesudah & tandai selesai' };
    if (s === 'SELESAI') return { step: 6, title:'Konfirmasi pelapor', text:`Pelapor diminta konfirmasi lewat halaman status. Tanpa respons ${AUTO_CLOSE_DAYS} hari kerja, tiket otomatis Closed.`, action:'Pelapor konfirmasi: sudah beres' };
    return { step: 6, allDone: true, title: ST[s].label, text:`Alur ${code} selesai. Semua langkah tercatat di riwayat tiket dan masuk ke dashboard.`, action:'Ulangi dari scan QR' };
  })();

  function demoNext() {
    if (!demoT) {
      if (phone.screen !== 'form') { scan('L1-TOILET-PRIA-URINOIR'); return; }
      const ready = form.cat && (form.issue || form.desc.trim().length >= 10);
      if (!ready) {
        const chip = (QUICK[LOC[phone.loc].area] || [])[phone.loc === 'L1-TOILET-PRIA-URINOIR' ? 1 : 0];
        setForm(f => ({ ...f, issue: chip[0], cat: chip[1], jenis: jenisFor(chip[1]), desc: phone.loc === 'L1-TOILET-PRIA-URINOIR' ? 'Urinoir paling ujung mampet, air menggenang di lantai.' : 'Mohon segera dicek.', photos: f.photos.length ? f.photos : [samplePhoto(chip[0])], email: f.email || 'rina.kartika@apotekalpro.id', dupDismissed: true, errors:{} }));
        show('pelapor'); return;
      }
      if (submit()) show('notif');
      return;
    }
    const id = demoT.id, s = demoT.status;
    if (s === 'BARU') { act.fromTelegram(id, 'accept'); show('admin'); }
    else if (s === 'DITERIMA') { act.schedule(id, { when: nextWorkSlot(Date.now(), 10), exec:'internal', who: TEAMS[demoT.team].staff[0], vendor:'', cost: 0 }); setSelId(id); show('notif'); }
    else if (s === 'MENUNGGU') { demoT.waitReason === 'approval' ? act.approve(id) : act.resume(id); setSelId(id); show('admin'); }
    else if (s === 'DIJADWALKAN') { act.start(id); setSelId(id); show('admin'); }
    else if (s === 'DIKERJAKAN') { act.finish(id, samplePhoto('Sudah diperbaiki', true), demoT.loc === 'L1-TOILET-PRIA-URINOIR' ? 'Saluran urinoir dibersihkan' : 'Perbaikan selesai'); setSelId(id); setPhone({ screen:'status', loc: demoT.loc, ticketId: id }); show('pelapor'); }
    else if (s === 'SELESAI') { confirm(id, 5, 'Cepat ditangani.'); setPhone({ screen:'status', loc: demoT.loc, ticketId: id }); show('pelapor'); }
    else resetDemo();
  }
  function resetDemo() { setDemoId(null); setSelId(null); setPhone({ screen:'scan', loc:null, ticketId:null }); setForm(emptyForm()); show('pelapor'); }
  function resetAll() { NID = 0; seqRef.current = 12; Object.assign(SAVED_ID, PEOPLE.rina); setDb(seed()); resetDemo(); setAdminTab('tiket'); say('Data contoh dipulihkan'); }

  const ctx = { db, phone, setPhone, form, setForm, submit, meToo, scan, act, confirm, reopen, adminTab, setAdminTab, selId, setSelId, openTicket, demoId, stepInfo, demoNext, resetDemo };
  const nextTheme = theme === 'dark' ? 'light' : 'dark';
  const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const newNotifs = db.notifs.filter(n => n.fresh).length;

  return html`<${Ctx.Provider} value=${ctx}><div className="wrap">
    <header className="topbar">
      <div className="logo"><img src=${LOGO} alt="Apotek Alpro" /></div>
      <div className="brandname"><b>Tiket Fasilitas HQ</b><span className="caption">Prototype alur pengaduan fasilitas kantor pusat · data contoh</span></div>
      <div className="spacer"></div>
      <div className="toolbar">
        <button className="btn btn-secondary btn-sm" onClick=${() => setTheme(isDark ? 'light' : 'dark')} aria-label="Ganti tema"><${Icon} name=${isDark ? 'sun' : 'moon'} size=${14} />${isDark ? 'Terang' : 'Gelap'}</button>
        <button className="btn btn-secondary btn-sm" onClick=${resetAll}><${Icon} name="reset" size=${14} />Reset data</button>
      </div>
    </header>
    <${Flow} />
    <div className="switch small tabs" role="tablist" style=${{ alignSelf:'flex-start' }}>
      ${[['pelapor','HP pelapor','phone'],['notif','Notifikasi','bell'],['admin','Admin','monitor']].map(([k, l, ic]) => html`<button key=${k} role="tab" className="tab" aria-selected=${String(view === k)} onClick=${() => show(k)}><${Icon} name=${ic} size=${14} />${l}${k === 'notif' && newNotifs > 0 && html`<span className="count">${newNotifs}</span>`}</button>`)}
    </div>
    <div className="cols" data-view=${view} data-right=${right}>
      <div className="col col-pelapor"><div className="colhead"><span className="n">1</span><b>HP pelapor</b><span className="caption">Karyawan HQ, tanpa login</span></div><${Phone} /></div>
      <div className="col col-notif">
        <div className="colhead"><span className="n">2</span><b>Notifikasi</b><span className="caption">Email + Telegram</span>
          <div className="switch mid tabs" style=${{ marginLeft:'auto' }}><button className="tab" aria-selected="true">Notifikasi</button><button className="tab" aria-selected="false" onClick=${() => show('admin')}>Admin</button></div></div>
        <${Notifs} /></div>
      <div className="col col-admin">
        <div className="colhead"><span className="n">3</span><b>Panel admin</b><span className="caption">GA · IT · Housekeeping · Ops Manager</span>
          <div className="switch mid tabs" style=${{ marginLeft:'auto' }}><button className="tab" aria-selected="false" onClick=${() => show('notif')}>Notifikasi${newNotifs > 0 && html`<span className="count">${newNotifs}</span>`}</button><button className="tab" aria-selected="true">Admin</button></div></div>
        <${Admin} /></div>
    </div>
    ${toast && html`<div className="toast" role="status"><${Icon} name="checkc" />${toast}</div>`}
  </div><//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
